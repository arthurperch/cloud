services:
  localstack:
    container_name: cloud-lab-localstack
    image: localstack/localstack:4
    ports:
      - "4566:4566"
    environment:
      - SERVICES=${LOCALSTACK_SERVICES:-s3,lambda,dynamodb,iam,sts,logs,sqs,sns}
      - DEBUG=${LOCALSTACK_DEBUG:-0}
      - PERSISTENCE=1
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - localstack-data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  localstack-data:
